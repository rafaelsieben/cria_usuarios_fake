<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Travel — Controle de viagens</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { background: #0a0a0c; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 28px 16px; }
  input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0.5; }
  input::placeholder { color: rgba(60,60,67,0.3); }
  .dark input::placeholder { color: rgba(235,235,245,0.3); }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  .screen-enter { animation: slideIn 280ms cubic-bezier(.2,.8,.2,1); }
  @keyframes slideIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: translateX(0); } }
  .modal-enter { animation: slideUp 320ms cubic-bezier(.2,.8,.2,1); }
  @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes scanLine { 0% { top: 10%; } 50% { top: 86%; } 100% { top: 10%; } }
  @keyframes spin { to { transform: rotate(360deg) } }
  ::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="app/data.jsx"></script>
<script type="text/babel" src="app/ui.jsx"></script>
<script type="text/babel" src="app/airlines.jsx"></script>
<script type="text/babel" src="app/auth.jsx"></script>
<script type="text/babel" src="app/screen-calendar.jsx"></script>
<script type="text/babel" src="app/screens-more.jsx"></script>
<script type="text/babel" src="app/settings.jsx"></script>
<script type="text/babel" src="app/quick-add.jsx"></script>
<script type="text/babel" src="app/lodging-calendar.jsx"></script>

<script type="text/babel">

const TWEAK_DEFAULTS = {
  "accent": "#FF6B2C",
  "dark": false,
  "cardStyle": "elevated",
  "lang": "pt"
};

function TabBar({ active, onChange, theme, lang }) {
  const L = STR[lang];
  const tabs = [
    { key: 'calendar', label: L.tabCalendar, icon: Icon.calendar },
    { key: 'trips',    label: L.tabTrips,    icon: Icon.list },
    { key: 'reports',  label: L.tabReports,  icon: Icon.chart },
    { key: 'settings', label: L.tabSettings, icon: Icon.cog },
  ];
  return (
    <div style={{
      position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 40,
      paddingBottom: 28, paddingTop: 6,
      background: theme.dark ? 'rgba(10,10,12,0.85)' : 'rgba(255,255,255,0.85)',
      backdropFilter: 'blur(20px) saturate(180%)',
      WebkitBackdropFilter: 'blur(20px) saturate(180%)',
      borderTop: `0.5px solid ${theme.separator}`,
      display: 'flex',
    }}>
      {tabs.map(t => {
        const on = active === t.key;
        const c = on ? theme.accent : theme.textMuted;
        return (
          <button key={t.key} onClick={() => onChange(t.key)} style={{
            flex: 1, background: 'transparent', border: 'none',
            padding: '6px 0 2px', cursor: 'pointer',
            display: 'flex', flexDirection: 'column',
            alignItems: 'center', gap: 3,
          }}>
            {t.icon(c, 24)}
            <div style={{ fontSize: 10, fontWeight: on ? 700 : 500, color: c, letterSpacing: 0.1 }}>{t.label}</div>
          </button>
        );
      })}
    </div>
  );
}

function Fab({ theme, onClick }) {
  return (
    <button onClick={onClick} style={{
      position: 'absolute', bottom: 100, right: 20, zIndex: 35,
      width: 56, height: 56, borderRadius: 999, border: 'none',
      background: theme.accent, color: '#fff',
      boxShadow: `0 8px 24px ${theme.accent}55, 0 2px 6px rgba(0,0,0,0.15)`,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      cursor: 'pointer',
    }}>{Icon.plus('#fff', 26)}</button>
  );
}

function App() {
  const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
  const { accent, dark, cardStyle, lang } = tweaks;
  const theme = useTheme(dark, accent, cardStyle);
  const [tab, setTab] = React.useState('calendar');
  const [openTripId, setOpenTripId] = React.useState(null);
  const [showNew, setShowNew] = React.useState(false);
  const [showLodging, setShowLodging] = React.useState(null);
  const [showCalendar, setShowCalendar] = React.useState(null);
  const [calendarToast, setCalendarToast] = React.useState(null);
  const [quickAdd, setQuickAdd] = React.useState(null);
  const [trips, setTrips] = React.useState(TRIPS);
  const [authed, setAuthed] = React.useState(false);
  const [user, setUser] = React.useState({ name: 'Pedro Almeida', email: 'pedro@exemplo.com', phone: '+55 11 99876-5432' });
  const [faceIdOn, setFaceIdOn] = React.useState(true);
  const [cloudProvider, setCloudProvider] = React.useState('iCloud');
  const [lastSync, setLastSync] = React.useState(lang === 'pt' ? 'hoje, 09:42' : 'today, 9:42am');
  const [syncing, setSyncing] = React.useState(false);

  const updateTweaks = (next) => {
    setTweaks(next);
  };

  const openTrip = trips.find(t => t.id === openTripId);

  const handleSaveNew = (form) => {
    if (!form.name) { setShowNew(false); return; }
    const flightsPriceNum = parseFloat(form.flightsPrice) || null;
    const lodgingDone = !!(form.lodging && form.lodging.name);
    const initialExpenses = [];
    if (flightsPriceNum && flightsPriceNum > 0) {
      const codes = [form.flightOutCode, form.flightBackCode].filter(Boolean).join(' / ');
      initialExpenses.push({
        id: `f-${Date.now()}`, date: form.start || '2026-01-01',
        cat: 'flight', amount: flightsPriceNum,
        desc: `${form.airline || ''}${codes ? ' ' + codes : ''}`.trim() || (lang === 'pt' ? 'Passagens (ida+volta)' : 'Flights (round-trip)'),
      });
    }
    if (lodgingDone && form.lodging.price && parseFloat(form.lodging.price) > 0) {
      initialExpenses.push({
        id: `l-${Date.now()}`, date: form.start || '2026-01-01',
        cat: 'hotel', amount: parseFloat(form.lodging.price),
        desc: form.lodging.name,
      });
    }
    const t = {
      id: `new-${Date.now()}`,
      name: form.name || (lang === 'pt' ? 'Nova viagem' : 'New trip'),
      city: form.city || '—',
      country: 'BR',
      airline: form.airline || '',
      notes: form.notes || '',
      start: form.start || '2026-12-01',
      end: form.end || '2026-12-03',
      budget: parseFloat(form.budget) || 3000,
      currency: 'BRL',
      flightsPrice: flightsPriceNum,
      checklist: {
        flightOut: { done: true, airline: form.airline, code: form.flightOutCode || '', booking: form.flightOutBooking || '', seat: form.flightOutSeat || '', currency: 'BRL' },
        flightBack: { done: true, airline: form.airline, code: form.flightBackCode || '', booking: form.flightBackBooking || '', seat: form.flightBackSeat || '', currency: 'BRL' },
        lodging: lodgingDone
          ? { done: true, kind: form.lodging.kind, name: form.lodging.name, code: form.lodging.code, price: parseFloat(form.lodging.price) || null, checkIn: form.start, checkOut: form.end, currency: 'BRL' }
          : { done: false, price: null },
      },
      expenses: initialExpenses,
    };
    setTrips([...trips, t]);
    setShowNew(false);
    setTab('trips');
    setOpenTripId(t.id);
  };

  const handleSaveLodging = (tripId, data) => {
    setTrips(ts => ts.map(t => {
      if (t.id !== tripId) return t;
      const price = parseFloat(data.price) || null;
      const paidAt = data.paidAt || 'booking';
      const expenseDate = paidAt === 'onsite' ? t.end : t.start;
      const newExpenses = [...t.expenses];
      if (price > 0) {
        newExpenses.push({ id: `l-${Date.now()}`, date: expenseDate, cat: 'hotel', amount: price, desc: data.name });
      }
      return {
        ...t,
        checklist: {
          ...t.checklist,
          lodging: { done: true, kind: data.kind, name: data.name, code: data.code, price, checkIn: t.start, checkOut: t.end, currency: 'BRL', paidAt },
        },
        expenses: newExpenses,
      };
    }));
    setShowLodging(null);
  };

  const handleSaveExpense = (e) => {
    setTrips(ts => ts.map(t => t.id === e.tripId
      ? { ...t, expenses: [...t.expenses, { id: e.id, date: e.date, cat: e.cat, amount: e.amount, desc: e.desc }] }
      : t));
    setQuickAdd(null);
  };

  const suggestedTripId = (() => {
    const ongoing = trips.find(t => tripStatus(t).state === 'ongoing');
    if (ongoing) return ongoing.id;
    const upcomingSoon = trips.find(t => {
      const st = tripStatus(t);
      return st.state === 'upcoming' && st.days <= 3;
    });
    if (upcomingSoon) return upcomingSoon.id;
    const justEnded = trips.find(t => {
      const st = tripStatus(t);
      return st.state === 'past' && st.days <= 3;
    });
    return justEnded?.id || null;
  })();

  const openQuickAdd = (tripId) => setQuickAdd({ tripId: tripId || suggestedTripId });

  const screen = (() => {
    if (openTrip) {
      return <TripDetailScreen theme={theme} lang={lang} trip={openTrip}
        onBack={() => setOpenTripId(null)} onAddExpense={() => openQuickAdd(openTrip.id)}
        onAddLodging={() => setShowLodging(openTrip.id)}
        onAddToCalendar={() => setShowCalendar(openTrip.id)}/>;
    }
    switch (tab) {
      case 'calendar': return <CalendarScreen theme={theme} lang={lang} trips={trips}
        onOpenTrip={setOpenTripId} onNewTrip={() => setShowNew(true)}/>;
      case 'trips': return <TripsListScreen theme={theme} lang={lang} trips={trips}
        onOpenTrip={setOpenTripId} onNewTrip={() => setShowNew(true)}/>;
      case 'reports': return <ReportsScreen theme={theme} lang={lang} trips={trips}/>;
      case 'settings': return <SettingsScreen theme={theme} lang={lang} accent={accent}
        onSetAccent={v => updateTweaks({ ...tweaks, accent: v })}
        dark={dark} onToggleDark={v => updateTweaks({ ...tweaks, dark: v })}
        cardStyle={cardStyle} onSetCardStyle={v => updateTweaks({ ...tweaks, cardStyle: v })}
        onSetLang={v => updateTweaks({ ...tweaks, lang: v })}
        user={user} onUpdateUser={setUser}
        cloudProvider={cloudProvider} onSetCloudProvider={setCloudProvider}
        faceIdOn={faceIdOn} onToggleFaceId={setFaceIdOn}
        lastSync={lastSync} syncing={syncing}
        onSyncNow={() => {
          setSyncing(true);
          setTimeout(() => { setSyncing(false); setLastSync(STR[lang].syncedNow); }, 1400);
        }}
        onSignOut={() => setAuthed(false)}/>;
    }
  })();

  if (!authed) {
    return (
      <div style={{ position: 'relative', display: 'flex', gap: 32, alignItems: 'center' }}>
        <IOSDevice dark={dark} width={402} height={874}>
          <div style={{ height: 54 }}/>
          <div style={{ minHeight: 'calc(100% - 54px)', background: theme.bg }}>
            <AuthScreen theme={theme} lang={lang} onAuthed={(u) => {
              setUser(prev => ({ ...prev, ...u }));
              setFaceIdOn(!!u.faceId);
              setAuthed(true);
            }}/>
          </div>
        </IOSDevice>
      </div>
    );
  }

  return (
    <div style={{ position: 'relative', display: 'flex', gap: 32, alignItems: 'center' }}>
      <IOSDevice dark={dark} width={402} height={874}>
        <div style={{ height: 54 }}/>
        <div key={openTripId || tab} className="screen-enter" style={{
          minHeight: 'calc(100% - 54px)', background: theme.bg,
        }}>
          {screen}
        </div>
        {!openTrip && (tab === 'calendar' || tab === 'trips') && (
          <Fab theme={theme} onClick={() => openQuickAdd()}/>
        )}
        {!openTrip && <TabBar active={tab} onChange={setTab} theme={theme} lang={lang}/>}

        {quickAdd && (
          <div style={{ position: 'absolute', top: 0, left: 0, right: 0, bottom: 0, zIndex: 75 }}>
            <div style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.35)' }} onClick={() => setQuickAdd(null)}/>
            <div className="modal-enter" style={{
              position: 'absolute', left: 0, right: 0, bottom: 0,
              background: theme.bg, borderRadius: '22px 22px 0 0',
              maxHeight: '88%', overflow: 'auto',
              boxShadow: '0 -10px 40px rgba(0,0,0,0.2)',
            }}>
              <QuickAddExpense
                theme={theme} lang={lang} trips={trips}
                defaultTripId={quickAdd.tripId}
                onClose={() => setQuickAdd(null)}
                onSave={handleSaveExpense}
              />
            </div>
          </div>
        )}

        {showNew && (
          <div style={{ position: 'absolute', top: 0, left: 0, right: 0, bottom: 0, zIndex: 70 }}>
            <div style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.3)' }} onClick={() => setShowNew(false)}/>
            <div className="modal-enter" style={{
              position: 'absolute', top: 40, left: 0, right: 0, bottom: 0,
              background: theme.bg, borderRadius: '20px 20px 0 0', overflow: 'auto',
            }}>
              <div style={{ width: 36, height: 5, borderRadius: 999, background: theme.textTertiary, margin: '8px auto 4px' }}/>
              <NewTripScreen theme={theme} lang={lang} onClose={() => setShowNew(false)} onSave={handleSaveNew}/>
            </div>
          </div>
        )}

        {showLodging && (
          <div style={{ position: 'absolute', top: 0, left: 0, right: 0, bottom: 0, zIndex: 72 }}>
            <div style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.35)' }} onClick={() => setShowLodging(null)}/>
            <div className="modal-enter" style={{
              position: 'absolute', top: 80, left: 0, right: 0, bottom: 0,
              background: theme.bg, borderRadius: '20px 20px 0 0', overflow: 'auto',
            }}>
              <div style={{ width: 36, height: 5, borderRadius: 999, background: theme.textTertiary, margin: '8px auto 4px' }}/>
              <AddLodgingScreen
                theme={theme} lang={lang}
                trip={trips.find(t => t.id === showLodging)}
                onClose={() => setShowLodging(null)}
                onSave={(data) => handleSaveLodging(showLodging, data)}
              />
            </div>
          </div>
        )}

        {showCalendar && (
          <div style={{ position: 'absolute', top: 0, left: 0, right: 0, bottom: 0, zIndex: 72 }}>
            <div style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.35)' }} onClick={() => setShowCalendar(null)}/>
            <div className="modal-enter" style={{
              position: 'absolute', top: 120, left: 0, right: 0, bottom: 0,
              background: theme.bg, borderRadius: '20px 20px 0 0', overflow: 'auto',
            }}>
              <div style={{ width: 36, height: 5, borderRadius: 999, background: theme.textTertiary, margin: '8px auto 4px' }}/>
              <AddToCalendarScreen
                theme={theme} lang={lang}
                trip={trips.find(t => t.id === showCalendar)}
                onClose={() => setShowCalendar(null)}
                onAdded={(n) => {
                  setShowCalendar(null);
                  setCalendarToast(n);
                  setTimeout(() => setCalendarToast(null), 2400);
                }}
              />
            </div>
          </div>
        )}

        {calendarToast && (
          <div style={{ position: 'absolute', left: 20, right: 20, bottom: 100, zIndex: 90, pointerEvents: 'none' }}>
            <div className="modal-enter" style={{
              background: theme.dark ? 'rgba(40,40,42,0.96)' : 'rgba(28,28,30,0.94)',
              color: '#fff', padding: '12px 16px', borderRadius: 14,
              display: 'flex', alignItems: 'center', gap: 10,
              backdropFilter: 'blur(20px)',
              boxShadow: '0 10px 40px rgba(0,0,0,0.25)',
            }}>
              <div style={{
                width: 28, height: 28, borderRadius: 999, background: theme.success,
                display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
              }}>{Icon.check('#fff', 16)}</div>
              <div style={{ fontSize: 14, fontWeight: 500, flex: 1 }}>
                {STR[lang].addedToCalendar}
                {calendarToast > 1 && ` · ${calendarToast} ${lang === 'pt' ? 'eventos' : 'events'}`}
              </div>
            </div>
          </div>
        )}
      </IOSDevice>
    </div>
  );
}

function __mount() {
  if (typeof CalendarScreen !== 'function' || typeof TripsListScreen !== 'function' ||
      typeof AuthScreen !== 'function' || typeof IOSDevice !== 'function' ||
      typeof QuickAddExpense !== 'function' || typeof SettingsScreen !== 'function') {
    return setTimeout(__mount, 50);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
}
__mount();
</script>

</body>
</html>
